[project]
name = "app"
version = "0.0.6"
description = ""
authors = [{ name = "Anderson Resende", email = "anderson@vinta.com.br" }]
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "fastapi[standard]>=0.115.0,<0.116",
    "asyncpg>=0.29.0,<0.30",
    "fastapi-users[sqlalchemy]>=13.0.0,<14",
    "pydantic-settings>=2.5.2,<3",
    "fastapi-mail>=1.4.1,<2",
    "fastapi-pagination==0.13.3",
    # ML inference stack — needed to load and serve trained anomaly models.
    # The heuristic detector path doesn't import these (lazy imports inside
    # `app/anomaly/detector.py:_try_model`), so the API still boots if one
    # of these resolves badly in dev.
    "numpy>=1.26,<3",
    "pandas>=2.0,<3",
    "scikit-learn>=1.4,<2",
    "scipy>=1.11,<2",
    "joblib>=1.3,<2",
    # Torch is heavy (~700MB CPU wheel). If image size matters more than
    # ergonomics, switch to the CPU-only index in the Dockerfile.
    "torch>=2.1,<3",
]

[dependency-groups]
dev = [
    "pre-commit>=3.4.0,<4",
    "ruff>=0.1.0,<0.2",
    "watchdog>=5.0.3,<6",
    "python-dotenv>=1.0.1,<2",
    "pytest>=8.3.3,<9",
    "pytest-mock>=3.14.0,<4",
    "mypy>=1.13.0,<2",
    "coveralls>=4.0.1,<5",
    "alembic>=1.14.0,<2",
    "pytest-asyncio>=0.24.0,<0.25",
    "mkdocs-material>=9.6.9",
    "mkdocs-material[imaging]>=9.6.9",
]
# Training-only extras: install with `uv sync --group ml-train`.
# Kept out of the runtime image so production stays slim.
ml-train = [
    "matplotlib>=3.8,<4",
    "kagglehub>=0.3,<1",
]

[tool.uv]
package = false

# Force torch to the CPU-only wheel index on Linux. macOS already ships
# CPU-only torch on PyPI, so we leave that platform on the default index.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "platform_system == 'Linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.sdist]
include = ["commands"]

[tool.hatch.build.targets.wheel]
include = ["commands"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
