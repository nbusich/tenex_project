# Cloud Build pipeline that builds + deploys both services to Cloud Run.
#
# Required substitutions (or env vars):
#   _REGION              — GCP region, default us-central1
#   _BACKEND_SERVICE     — Cloud Run service name for the API
#   _FRONTEND_SERVICE    — Cloud Run service name for the UI
#   _BACKEND_URL         — public URL of the deployed backend (set after first deploy)
#
# Secrets (managed via Secret Manager, NOT baked into images):
#   DATABASE_URL, ACCESS_SECRET_KEY, RESET_PASSWORD_SECRET_KEY,
#   VERIFICATION_SECRET_KEY, GEMINI_API_KEY (optional), ANTHROPIC_API_KEY (optional)

substitutions:
  _REGION: us-central1
  _BACKEND_SERVICE: tenex-backend
  _FRONTEND_SERVICE: tenex-frontend
  _BACKEND_URL: ""

steps:
  # ---- Backend ----
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/$_BACKEND_SERVICE:$SHORT_SHA
      - ./fastapi_backend

  - id: push-backend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/$_BACKEND_SERVICE:$SHORT_SHA

  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_BACKEND_SERVICE
      - --image
      - gcr.io/$PROJECT_ID/$_BACKEND_SERVICE:$SHORT_SHA
      - --region
      - $_REGION
      - --platform
      - managed
      - --allow-unauthenticated
      - --command
      - ./start.prod.sh
      - --update-secrets
      - >-
        DATABASE_URL=DATABASE_URL:latest,
        ACCESS_SECRET_KEY=ACCESS_SECRET_KEY:latest,
        RESET_PASSWORD_SECRET_KEY=RESET_PASSWORD_SECRET_KEY:latest,
        VERIFICATION_SECRET_KEY=VERIFICATION_SECRET_KEY:latest,
        GEMINI_API_KEY=GEMINI_API_KEY:latest,
        ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest

  # ---- Frontend ----
  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - API_BASE_URL=$_BACKEND_URL
      - -t
      - gcr.io/$PROJECT_ID/$_FRONTEND_SERVICE:$SHORT_SHA
      - ./nextjs-frontend

  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/$_FRONTEND_SERVICE:$SHORT_SHA

  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_FRONTEND_SERVICE
      - --image
      - gcr.io/$PROJECT_ID/$_FRONTEND_SERVICE:$SHORT_SHA
      - --region
      - $_REGION
      - --platform
      - managed
      - --allow-unauthenticated
      - --set-env-vars
      - API_BASE_URL=$_BACKEND_URL

images:
  - gcr.io/$PROJECT_ID/$_BACKEND_SERVICE:$SHORT_SHA
  - gcr.io/$PROJECT_ID/$_FRONTEND_SERVICE:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
